apiVersion: v1
kind: Secret
metadata: {name: never-read}
stringData:
  endpoint: https://secret-must-never-be-stored.example.com
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: secret-reference}
spec:
  template:
    spec:
      containers:
        - name: app
          image: example/app:latest
          env:
            - name: SECRET_URL
              valueFrom:
                secretKeyRef: {name: never-read, key: endpoint}
